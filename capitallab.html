<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capital laboratory</title>
<style>
:root{--ink:#eef2f8;--mute:#a7b2c4;--line:#334055;--gold:#e2b75a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101620;color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;pointer-events:none}
#hud{position:fixed;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 20px);background:rgba(12,18,28,.82);border:1px solid var(--line);padding:6px 8px}
#hud button,#hud select{background:transparent;color:var(--ink);border:1px solid var(--line);padding:3px 8px;font:inherit;cursor:pointer}
#hud button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
#hud button:focus-visible,#hud select:focus-visible{outline:2px solid #8fb4ff;outline-offset:1px}
#stats{color:var(--mute);font-variant-numeric:tabular-nums}
body.still #hud{display:none}
.cap-tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px;max-width:150px;padding:2px 7px 2px 2px;background:rgba(12,18,30,.82);border:1px solid rgba(217,180,90,.55);color:#f1ead8;font-size:11px;white-space:nowrap}
.cap-tag .lv{display:inline-grid;place-items:center;min-width:18px;height:18px;background:#2b5d9b;color:#fff;font-weight:700;border-radius:50%;font-size:10.5px}
.cap-tag .bar{flex-basis:100%;height:4px;background:rgba(255,255,255,.15)}
.cap-tag .bar i{display:block;height:100%;background:#e6b84f}
.cap-tag .tm{flex-basis:100%;font-size:10px;color:#e6c97a}
</style></head>
<body>
<div id="stage"><canvas data-testid="lab-canvas"></canvas><div id="overlay"></div></div>
<div id="hud" role="toolbar" aria-label="Capital laboratory">
  <b>Capital lab</b>
  <button data-variant="a">A · Current</button><button data-variant="b">B · New lighting</button><button data-variant="c">C · Diorama</button>
  <select id="quality" aria-label="Quality tier"><option value="desktop">Desktop</option><option value="medium">Medium</option><option value="mobile">Mobile</option></select>
  <select id="projection" aria-label="Projection"><option value="perspective">Perspective</option><option value="orthographic">Orthographic</option></select>
  <span id="stats" role="status"></span>
</div>
<script type="module" src="/src/dev/capitalLab.ts"></script>
</body></html>
