<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset comparison</title>
<style>
:root{--bg:#141922;--panel:#1b2230;--line:#2c3648;--ink:#e3e8f1;--mute:#9aa6ba;--prod:#d9b45a;--local:#6fc2a5;--ext:#8fa6e8;--bad:#e0715f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
header{grid-column:1/3;display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:14px;margin:0 12px 0 0;font-weight:600}
header button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:4px 10px;cursor:pointer;font:inherit}
header button[aria-pressed=true]{border-color:var(--prod);color:var(--prod)}
header button:focus-visible,#sets button:focus-visible{outline:2px solid var(--ext);outline-offset:2px}
#status{margin-left:auto;color:var(--mute)}
#view{position:relative;min-width:0}
#view canvas{display:block}
#sets{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:0 0 24px}
.set{border-bottom:1px solid var(--line);padding:12px 14px}
.set h2{font-size:13px;margin:0 0 4px;font-weight:600}
.set .meta{color:var(--mute);font-size:12px;margin-bottom:6px}
.set .meta a{color:var(--ext)}
.badge{display:inline-block;font-size:11px;padding:0 6px;border:1px solid currentColor;margin-right:6px}
.badge.production{color:var(--prod)}.badge.local{color:var(--local)}.badge.external{color:var(--ext)}
.set ul{margin:6px 0;padding-left:16px;color:var(--mute);font-size:12px}
.set .verdict{margin:6px 0 0}
.set .stats{font-size:12px;color:var(--local);margin-top:6px}
.set .stats .err{color:var(--bad)}
.set button.go{margin-top:6px;background:transparent;border:1px solid var(--line);color:var(--ink);padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
.previews{display:grid;gap:6px;margin-top:8px}
.previews figure{margin:0}
.previews img{width:100%;display:block;border:1px solid var(--line);background:#0e1218}
.previews figcaption{font-size:11px;color:var(--mute)}
.lbl{font-size:11px;color:var(--ink);background:rgba(16,20,28,.82);padding:1px 6px;white-space:nowrap;pointer-events:none;text-align:center}
.lbl small{color:var(--mute)}
.lbl.title{font-size:13px;font-weight:600;color:var(--prod);background:rgba(16,20,28,.9);padding:3px 8px}
.lbl.err{color:var(--bad)}
body.capture{grid-template-columns:1fr;grid-template-rows:1fr}
body.capture header,body.capture #sets{display:none}
body.capture #view{position:fixed;inset:0}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr}#sets{border-left:0;border-top:1px solid var(--line)}}
</style></head>
<body>
<header><h1>Asset comparison</h1>
<button data-cat="capital">Capital</button><button data-cat="ships">Spacecraft</button><button data-cat="heroes">Heroes</button><button data-cat="villains">Villains</button>
<span id="status" role="status"></span></header>
<main id="view"></main>
<aside id="sets" aria-label="Candidate sets"></aside>
<script type="module" src="/src/dev/compare.ts"></script>
</body></html>
