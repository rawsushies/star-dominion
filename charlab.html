<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character lab</title>
<style>
:root{--bg:#0d1119;--panel:rgba(16,21,32,.92);--line:#2c3648;--ink:#e3e8f1;--mute:#97a3b8;--prod:#d9b45a;--new:#6fc2a5}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:12px;top:12px;width:290px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);padding:12px;box-sizing:border-box}
#ui h1{font-size:15px;margin:0 0 4px}#ui p{margin:0 0 10px;color:var(--mute)}
label{display:block;margin:8px 0 3px;color:var(--mute)}select,button{width:100%;background:#1b2332;color:var(--ink);border:1px solid var(--line);padding:6px;font:inherit}
button{margin-top:6px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--new)}
#roles{display:flex;flex-wrap:wrap;gap:4px}#roles button{width:auto;margin:0;padding:4px 7px}#roles button[aria-pressed=true]{border-color:var(--new);color:var(--new)}
#stats{margin-top:10px;white-space:pre;font-variant-numeric:tabular-nums;color:var(--mute)}
#sel{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.lab{position:absolute;transform:translate(-50%,0);font-size:11px;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
.lab b{display:block;font-weight:600}.lab.prod b{color:var(--prod)}.lab.new b{color:var(--new)}
@media (max-width:640px){#ui{width:calc(100% - 24px);max-height:42%;top:auto;bottom:12px}}
</style></head>
<body><canvas id="c"></canvas><div id="labels"></div>
<div id="ui">
  <h1>Character lab</h1>
  <p>Gold labels are the current production models. Green labels are the new candidates, built from the Quaternius base characters, outfits and animation libraries.</p>
  <label>Role</label><div id="roles"></div>
  <label for="anim">Animation (all figures)</label><select id="anim"></select>
  <label for="light">Lighting</label><select id="light"><option value="hall">Hall of Heroes</option><option value="studio">Neutral studio</option><option value="dusk">Low key</option></select>
  <button id="reseed">New faces and builds</button>
  <div id="sel">Click a figure to inspect it.</div>
  <div id="stats"></div>
</div>
<script type="module" src="/src/dev/charLab.ts"></script></body></html>
